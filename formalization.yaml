status:
  scope: >-
    Fifty-nine compared theorems over twenty-two compared definitions (namespace AugmentedDescartes): the eight
    encoding theorems (Lorentz norms and pairings of sphere and hyperplane rows, the decoding of a unit row, the
    injectivity of augmented coordinates on valid objects), the Lorentz form of the matrix identity and its Gram
    form, the identity for spheres and for spheres with hyperplanes, its converse with uniqueness in both forms,
    the Soddy-Gosset relation in three forms, the curvature-centre identity in two forms, the complex Descartes
    theorem and its mixed relation, det Q_n = -2/n, the three statements for Mathlib's spheres, the existence
    of a configuration and of a sphere family in every dimension, the converse of Soddy-Gosset in two forms, the
    converse of the curvature-centre theorem with uniqueness and the matrix showing its hypothesis is needed,
    the five Apollonian statements (the generators preserve Q_n, carry configurations to configurations, the
    row formula, Soddy's two spheres in matrix and in geometric form), the six congruence statements (the
    unique motion in matrix and in geometric form, its parameters, the isometry, the action on sphere and
    hyperplane rows), the nine orientation statements (the power of a sphere and of a hyperplane row, its
    three negative sets, compatible orientations as a pointwise and as a disjointness statement, at most two
    hyperplanes, no three boundaries through a finite point) and the eight statements on motions and the
    geometric forms (a motion preserves validity, curvature and tangency, the motion matrix preserves the
    Lorentz pairing, congruence exactly when the curvatures agree, a family's total curvature is nonzero, its
    open interiors are pairwise disjoint when the total curvature is positive, at most two members are
    hyperplanes). All proved; no sorry, no axiom beyond propext, Classical.choice and Quot.sound; no
    native_decide.

