# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The augmented Descartes theorem in every dimension, W^T Q_n W = [[0,-4,0],[-4,0,0],[0,0,2I_n]] for n + 2 pairwise tangent oriented spheres and hyperplanes, its converse, the converses of Soddy-Gosset and of the curvature-centre identity, the complex Descartes theorem, and Soddy's two spheres"
  description: >-
    A Lean 4 development of Section 3 of Lagarias, Mallows and Wilks, Beyond the Descartes circle theorem
    (Amer. Math. Monthly 109 (2002) 338-361), in the Lorentz form. An oriented sphere in R^n with centre x and
    signed radius r has the augmented curvature-centre row (|x|^2/r - r, 1/r, x/r); an oriented hyperplane
    <h, y> = delta with unit normal h has the row (2 delta, 0, h) (LMW Definition 3.2, (3.7)-(3.9)). Tangency is
    distance-encoded in LMW's oriented sense: two spheres dist^2 = (r + s)^2 (external tangency for two
    positive radii, internal when one radius is negative), a sphere and a hyperplane <h, x> - delta = -r, two
    hyperplanes opposite unit normals, LMW's oriented tangency pair by pair; the disjoint-interiors property of
    an oriented Descartes configuration is not formalized, and the converses deliver tangency in this sense.
    Kernel-checked, for every n >= 1 (LMW's Section 3 assumes n >= 2; their Section 8, (8.4), is the identity on
    the line): the augmented matrix W of n + 2 pairwise tangent spheres of nonzero curvature, and of n + 2
    pairwise tangent spheres and hyperplanes, satisfies W^T Q_n W = [[0, -4, 0], [-4, 0, 0], [0, 0, 2 I_n]] with
    Q_n = I - (1/n) 11^T (Theorem 3.3); every real solution W is the augmented matrix of exactly one family of
    valid, pairwise tangent oriented spheres and hyperplanes, and, when its second column has no zero, of
    exactly one pairwise tangent family of spheres (the converse of Theorem 3.3); the Soddy-Gosset relation
    (sum 1/r_i)^2 = n sum (1/r_i)^2 with and without hyperplanes (Theorem 1.2, (1.2)) and its form b^T Q_n b = 0
    ((3.2)); the curvature-centre identity M^T Q_n M = diag(0, 2 I_n) (Theorem 3.2, (3.5)); at n = 2 the complex
    Descartes theorem (sum b_i z_i)^2 = 2 sum (b_i z_i)^2 and sum b_i (b_i z_i) = (1/2)(sum b_i)(sum b_i z_i)
    (Theorem 2.1, (2.2)-(2.3)); det Q_n = -2/n; and the three statements for Mathlib's EuclideanGeometry.Sphere
    (pairwise IsExtTangent, or one enclosing sphere to which the others are IsIntTangent, with curvature
    -1/r_e). The matrix identity is proved as LMW's Section 4 argument (Lemmas 4.3-4.4, (4.9)-(4.10)) run
    directly in Euclidean coordinates: W^T Q_n W is the target exactly when the rows of W have Lorentz norm 1
    and pair to -1 under G = [[0, -1/2, 0], [-1/2, 0, 0], [0, 0, I_n]], since W G W^T = 2I - J and
    (2I - J)(Q_n/2) = I. Also proved: the existence half of the converse of the Soddy-Gosset theorem (every
    nonzero b with (sum b_i)^2 = n sum b_i^2 is the curvature vector of a pairwise tangent family of spheres,
    where b_i is nonzero, and hyperplanes, where b_i = 0, and of a family of spheres when no b_i vanishes),
    the second half of LMW's Theorem 3.1, about which they write "We do not know an easy proof of this result;
    a proof appears in [16]" ([16] is Graham-Lagarias-Mallows-Wilks-Yan III, whose arXiv versions 1-2 prove
    both halves as their Theorem 2.2 from the same base configuration and the transitivity of the Lorentz
    group, a section the published version omits), proved here by one Q_n-reflection from the configuration of
    two parallel hyperplanes and n unit spheres (GLMWY III, Theorem 6.1); the congruence half is not
    formalized. The converse of Theorem 3.2 in every dimension under the hypothesis of a nonzero first column
    (every real M with M^T Q_n M = diag(0, 2 I_n) and a nonzero first column is the curvature-centre matrix of
    exactly one family of valid, pairwise tangent oriented spheres and hyperplanes), which GLMWY I, Theorem 3.1
    and its Remark, prove at n = 2 with that hypothesis and which LMW's printed converse ("any real solution
    M") and GLMWY III's Theorem 2.3 omit, together with the matrix at n = 2 with columns 0, e_0 - e_1,
    e_2 - e_3 (GLMWY I's configuration (3.15) with its first column zeroed), which solves the equation and is
    the curvature-centre matrix of no family. The existence of a configuration in every dimension (GLMWY III,
    Theorem 6.1); the Apollonian generators S_k = I + (2/(n-1)) e_k 1^T - (2n/(n-1)) e_k e_k^T of GLMWY III,
    (4.1), preserve Q_n and carry configurations to configurations, with the row formula
    (S_k W)_k = (2/(n-1)) sum_{i != k} W_i - W_k; and Soddy's two spheres in every dimension n >= 2 (LMW,
    footnote 3; GLMWY III, Section 4.1), in the signed sense: the oriented spheres and hyperplanes tangent to
    n + 1 members of a configuration are exactly the missing member and its Apollonian reflection, two distinct
    objects whose curvatures sum to (2/(n-1)) times the sum of the others' curvatures. The planar Soddy-Gosset
    relation with positive radii and one enclosing circle is already in Lean in facebookresearch/atlas-lean
    (descartes_circle_theorem, not registered); no other formalization of these statements was found by the
    dated search.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

classification:
  arxiv: ["math.MG"]
  msc2020: ["52C26", "51M04", "51B10"]

# Draft for augmented-descartes-lean/formalization.yaml (registry schema v0.4), prior-art lane, RT-071, 2026-10-10.
# Schema note: v0.4 says `id` carries the URL / DOI / arXiv id and `location` the locator inside the source;
# the URL of each paper's read copy is repeated in `location`. Searches dated 2026-10-10 (US) = 2026-10-11 00:15-00:45 UTC.

sources:
  - title: "Beyond the Descartes circle theorem"
    authors: ["Jeffrey C. Lagarias", "Colin L. Mallows", "Allan R. Wilks"]
    id: "doi:10.1080/00029890.2002.11920896"
    type: "paper"
    location: >-
      The American Mathematical Monthly 109 (2002), 338-361; read as arXiv:math/0101066v1
      (https://arxiv.org/abs/math/0101066, the only arXiv version), printed pages: Theorem 1.2 (the Soddy-Gossett
      theorem, (1.2)) and footnote 3, p. 3; Theorem 2.1 (the complex Descartes theorem, (2.2), (2.3)) and (2.1), p. 4;
      (3.1) and Theorem 3.1 (the converse to the Soddy-Gosset theorem), p. 7; Theorem 3.2 ((3.5)), p. 8; (3.7),
      Definition 3.2 ((3.8)), (3.9) and Theorem 3.3 ((3.11)), p. 9; footnote 4, p. 10; Section 8 ((8.2)-(8.4)),
      pp. 22-23. The Monthly print was not read.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The statement source. Theorem 3.3 (Wᵀ Qₙ W = [[0, −4, 0], [−4, 0, 0], [0, 0, 2Iₙ]] and its converse) for
      spheres of nonzero curvature and for spheres with hyperplanes, with tangency distance-encoded (their oriented
      Descartes configurations have disjoint interiors; the converses here give tangency in the signed sense only);
      its corollaries Theorem 1.2 (Soddy-Gosset; their spelling "Gossett"), Theorem 3.2 and Theorem 2.1 with (2.3);
      the existence half of Theorem 3.1 (the congruence half is not formalized); the converse of Theorem 3.2 under
      the hypothesis of a nonzero first column, which the printed converse omits; footnote 3 (exactly two spheres
      tangent to n + 1 members of a configuration) in signed form for n ≥ 2. n = 1 is included algebraically,
      in the signed-radius convention, not in the convention of Section 8. The proof route is their Section 4
      argument (Lemmas 4.3-4.4, (4.9)-(4.10)) run directly in Euclidean coordinates, where Section 5 lifts the
      Euclidean theorem from the spherical one: the Lorentz Gram identity W G Wᵀ = 2I − J, the inverse
      (2I − J)⁻¹ = Qₙ/2, and, for the converse of Theorem 3.1, Qₙ-reflections.
  - title: "Apollonian circle packings: geometry and group theory III. Higher dimensions (arXiv versions 1 and 2)"
    authors: ["Ronald L. Graham", "Jeffrey C. Lagarias", "Colin L. Mallows", "Allan R. Wilks", "Catherine H. Yan"]
    id: "arXiv:math/0010324v1"
    type: "paper"
    location: >-
      https://arxiv.org/abs/math/0010324v1 (2000-10-31), and v2 (2001-01-24), which keeps Section 2 with the same
      numbering and printed pages in the normalization Qₙ = I − (1/n)𝟙𝟙ᵀ: Theorem 2.2 (the converse to the
      Soddy-Gossett theorem: (i) existence, (ii) congruence), p. 4; Theorem 2.3 ((2.8), (2.9)), p. 5, its converse
      proof pp. 9-10; Theorem 2.4 and Lemma 2.5, pp. 11-12; the proof of Theorem 2.2, pp. 12-14. Section 2 is absent
      from v3 (2004-06-16), v4 (2005-03-11) and the journal version.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The proof LMW point to for their Theorems 3.1 and 3.2 (their reference [16], this preprint). converse_soddy_gosset is the
      existence half, Theorem 2.2 (i), proved along its route: a standard configuration (two parallel hyperplanes at
      distance 2, n unit spheres between them), an element of Aut(Qₙ) carrying its curvature vector to b (here one
      explicit Qₙ-reflection instead of the transitivity of O(n + 1, 1) on the null cone), then the converse of the
      augmented theorem. Its part (ii), congruence, is not formalized. Theorem 2.3 states the converse of the
      curvature-centre identity with no hypothesis; its proof rescales by a positive factor, which uses the positivity clause (2.9), and
      first assumes a first column without zero entries, treating zero entries by a limit it does not carry out;
      curvature_center_converse assumes a nonzero first column (equivalent, under (2.8), to a nonzero sum of
      curvatures) and is proved without limits. Theorem 2.4's converse, like the one here, derives tangency from the
      Gram identity in the signed sense.
  - title: "Apollonian circle packings: geometry and group theory III. Higher dimensions"
    authors: ["Ronald L. Graham", "Jeffrey C. Lagarias", "Colin L. Mallows", "Allan R. Wilks", "Catherine H. Yan"]
    id: "doi:10.1007/s00454-005-1197-8"
    type: "paper"
    location: >-
      Discrete & Computational Geometry 35 (2006), 37-72; read as arXiv:math/0010324v4 (https://arxiv.org/abs/math/0010324v4,
      2005-03-11), printed pages: Theorem 3.1 (the augmented Euclidean Descartes theorem, proved by citation of LMW),
      p. 8; the determinants of the three forms and Theorem 3.2, p. 9; Section 4.1 and (4.1), p. 11; Theorem 6.1 and its
      configuration of curvatures (0, 0, 1, ..., 1), p. 20; Lemma 6.4 and (6.4), p. 21. The journal print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The n-dimensional Apollonian generators Sⱼ = I + (2/(n−1)) eⱼ𝟙ᵀ − (2n/(n−1)) eⱼeⱼᵀ of (4.1), whose membership in
      Aut(Q_D,n) the paper calls straightforward and which apollonianGen_mem_aut proves, with their action (replace one
      sphere by the other sphere tangent to the remaining n + 1, asserted there; two_tangent_rows and
      two_tangent_spheres prove it in the signed sense); the configuration of Theorem 6.1's proof (described there
      without coordinates; exists_configuration places the unit spheres at √2 eᵢ); det Q_D,n = −2/n, (6.4) in the proof
      of Lemma 6.4 (det_descartesQ).
  - title: "Apollonian circle packings: geometry and group theory I. The Apollonian group"
    authors: ["Ronald L. Graham", "Jeffrey C. Lagarias", "Colin L. Mallows", "Allan R. Wilks", "Catherine H. Yan"]
    id: "doi:10.1007/s00454-005-1196-9"
    type: "paper"
    location: >-
      Discrete & Computational Geometry 34 (2005), 547-585; read as arXiv:math/0010298v5 (https://arxiv.org/abs/math/0010298v5,
      2005-03-11), printed pages: Theorem 3.1 (the extended Descartes theorem, its converse for a nonzero first column)
      and the Remark after it, p. 7; Theorem 3.2 and the hyperplane coordinate (b̄ twice the distance from the origin),
      pp. 8-9; the proof of the converse of Theorem 3.1, pp. 11-12; Section 3.3 ((3.25), the reflection operator S₁),
      p. 15; Definition 4.1 (the Apollonian group), p. 21. The journal print was not read.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The planar case. Theorem 3.1 states the converse of LMW's Theorem 3.2 at n = 2 with the hypothesis of a nonzero
      first column, and its Remark shows the hypothesis is necessary (zero the first column of a configuration's
      matrix); curvature_center_converse is that converse in every dimension, and the matrix of
      curvature_center_converse_needs_nonzero is, up to the order of rows and coordinates, the configuration (3.15)
      with its first column zeroed. The proof there is planar (the rational congruence J₀ of (3.12)-(3.13)); the proof
      here is the Qₙ-projection completion. The planar Apollonian group (Definition 4.1) is the case n = 2 of
      apollonianGen.
