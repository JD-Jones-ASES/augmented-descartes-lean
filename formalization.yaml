automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Fable 5.1 (Anthropic)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        The project was directed by its author. Claude (Anthropic) in Claude Code was used throughout: the
        reading of the two papers, the statements and their check against them, the exact replay of every
        identity in the standard library, the Lean proofs, the prior-art searches and the repository text;
        Claude Fable 5.1 pinned the statements, wrote the replay checker, merged the proof modules and wrote
        the documents, and Claude Opus 5.5 subagents wrote the Lean proofs, one module each, checked the
        statements against the printed pages and audited the proofs in separate passes. Lean v4.35.0-rc2 and
        Mathlib v4.35.0-rc2 (commit 065356127b1dc0016f66b7283ce0ce2c4055aa55) are pinned by the committed
        manifest and lake update is never run; there are no GitHub Actions workflows. There is no native_decide
        and no decide +kernel: the proofs are matrix algebra over the reals (entrywise computations, the
        explicit inverses, Matrix.mul_eq_one_comm_of_equiv for the swap of factors) and coordinate identities on
        EuclideanSpace R (Fin n) closed by field_simp, ring and linear_combination.
  spend_usd: "not tracked"

fidelity:
  divergences: >-
    Rows are indexed by Fin 2 + Fin n (the two hyperbolic coordinates b-bar, b and the n centre coordinates), so
    the augmented matrix has type Matrix (Fin (n + 2)) (Fin 2 + Fin n) R and the target is a fromBlocks
    matrix; LMW write (n + 2) x (n + 2) matrices. An oriented sphere or hyperplane is a value of the sum type
    (EuclideanSpace R (Fin n) x R) + (EuclideanSpace R (Fin n) x R), the left summand a centre with a signed
    radius, the right a unit normal with an offset, with validity (radius nonzero; normal of norm 1) a
    separate predicate; the curvature of a hyperplane is 0. Tangency is the distance encoding of LMW's oriented
    tangency (two spheres dist^2 = (r + s)^2; a sphere and a hyperplane <h, x> - delta = -r; two hyperplanes
    opposite normals), LMW's oriented tangency taken pair by pair; the disjoint-interiors property of an
    oriented Descartes configuration ("mutually tangent with distinct tangencies and compatible orientations")
    is not formalized, and the converses deliver tangency in the signed-distance sense. The dimension is every
    n >= 1 (hypothesis 0 < n, needed for Q_n), where LMW's Section 3 assumes n >= 2 and their Section 8 states
    the identity on the line, (8.4), with the same target; the Apollonian statements assume n >= 2. The
    converse of Theorem 3.2 carries the hypothesis that the first column of M is nonzero, which LMW's printed
    statement omits, which GLMWY I's Theorem 3.1 carries at n = 2, and which
    curvature_center_converse_needs_nonzero shows is needed. The converse of Theorem 3.1 is formalized in its
    existence half only; the congruence half is not. The Mathlib statements use
    EuclideanGeometry.Sphere.IsExtTangent and IsIntTangent with positive radii, the enclosing sphere's curvature
    written -1/r_e; sphere_soddy_gosset and sphere_augmented_descartes have no instance at n = 1 (three
    pairwise externally tangent intervals force a zero radius). Gosset is spelled as the mathematician spelled
    it (LMW print "Gossett" in Theorem 1.2 and "Gosset" in Theorem 3.1).

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is claimed; AI agents wrote the proofs
    and audited them in separate passes, the statements were checked against the printed pages of both papers,
    every identity is replayed exactly by scripts/check_descartes.py in the standard library, and VERIFICATION.md
    states what is checked and what is not. Mechanical correctness and agreement of formal statements do not
    establish priority or significance: the augmented theorem, its converse, the Soddy-Gosset and
    curvature-centre theorems and the complex Descartes theorem are LMW's, and the proof route is their
    Section 4 argument in Euclidean coordinates; the converses of Theorems 3.1 and 3.2 are stated by LMW, who
    refer to Graham-Lagarias-Mallows-Wilks-Yan III for proofs, and the n = 2 converse of Theorem 3.2 with its
    hypothesis is GLMWY I's Theorem 3.1; the Apollonian generators, the existence of a configuration and
    det Q_n are in GLMWY III, and the two-spheres count in LMW's footnote 3. No earlier kernel check of any of
    these statements beyond ATLAS's planar relation was found by the dated search (Palomar's feed and day index,
    ATLAS, Mathlib and its 1000.yaml, formal-conjectures, openai/math, LeanPool, the Isabelle AFP, Rocq's opam
    index, HOL Light, GitHub code search in Lean, Isabelle and Coq, the arXiv listing, 2026-10-09 and
    2026-10-10); no first is claimed beyond it.


alignment:
  namespace: "AugmentedDescartes"
  statements:
    - source: "This development (the Lorentz norm of a sphere row; LMW Lemma 4.3(i) transported by (5.1)-(5.2))"
      lean: "AugmentedDescartes.lorentz_sphereRow_self"
      module: "Solution"
      status: "proved"
      note: "A sphere row has Lorentz norm `1`."
    - source: "This development (LMW Lemma 4.3(ii) transported: tangency is the pairing -1)"
      lean: "AugmentedDescartes.lorentz_sphereRow_eq_neg_one_iff"
      module: "Solution"
      status: "proved"
      note: "Two sphere rows pair to `−1` exactly when the spheres are tangent in the signed sense."
    - source: "This development (LMW (3.9): the hyperplane row (2 delta, 0, h))"
      lean: "AugmentedDescartes.lorentz_sphereRow_planeRow_eq_neg_one_iff"
      module: "Solution"
      status: "proved"
      note: "A sphere row and a hyperplane row pair to `−1` exactly when `⟪h, x⟫ − δ = −r`."
    - source: "This development (LMW (3.9): two hyperplanes, tangent at infinity)"
      lean: "AugmentedDescartes.lorentz_planeRow_eq_neg_one_iff"
      module: "Solution"
      status: "proved"
      note: "Two unit-normal hyperplane rows pair to `−1` exactly when the normals are opposite."
    - source: "This development (LMW Definition 3.2 and (3.9))"
      lean: "AugmentedDescartes.lorentz_row_self"
      module: "Solution"
      status: "proved"
      note: "A valid oriented sphere or hyperplane has a row of Lorentz norm `1`."
    - source: "This development (LMW Section 3: oriented tangency, by cases)"
      lean: "AugmentedDescartes.lorentz_row_eq_neg_one_iff"
      module: "Solution"
      status: "proved"
      note: "Two valid oriented spheres or hyperplanes pair to `−1` exactly when they are tangent."
    - source: "LMW, the paragraph after (3.9): augmented coordinates are a global coordinate system"
      lean: "AugmentedDescartes.row_injOn_valid"
      module: "Solution"
      status: "proved"
      note: "Augmented coordinates are a global coordinate system (LMW, after (3.9)): valid oriented spheres and hyperplanes with the same row are equal."
    - source: "This development (the decoding of a row of Lorentz norm 1)"
      lean: "AugmentedDescartes.exists_orientedSphere_of_lorentz_self"
      module: "Solution"
      status: "proved"
      note: "Every row of Lorentz norm `1` is the row of a valid oriented sphere (second coordinate nonzero) or hyperplane (second coordinate zero)."
    - source: "This development (the Lorentz form of LMW Theorem 3.3: (4.9)-(4.10) and Lemma 4.4 transported)"
      lean: "AugmentedDescartes.augmented_identity_iff_lorentz"
      module: "Solution"
      status: "proved"
      note: "`Wᵀ Qₙ W` is the target exactly when the rows of `W` have Lorentz norm `1` and pair to `−1`."
    - source: "LMW (4.9) transported to Euclidean rows: W G W^T = 2I - J"
      lean: "AugmentedDescartes.gram_eq_of_augmented_identity"
      module: "Solution"
      status: "proved"
      note: "The Gram form of the identity: `W G Wᵀ = 2I − J`."
    - source: "LMW Theorem 3.3, equation (3.11), for spheres of nonzero curvature, n >= 1"
      lean: "AugmentedDescartes.augmented_descartes"
      module: "Solution"
      status: "proved"
      note: "The augmented Euclidean Descartes theorem (LMW Theorem 3.3; (8.4) at `n = 1`) for spheres of nonzero curvature: `Wᵀ Qₙ W = [[0, −4, 0], [−4, 0, 0], [0, 0, 2 Iₙ]]`."
    - source: "LMW Theorem 3.3, equation (3.11), spheres and hyperplanes, n >= 1"
      lean: "AugmentedDescartes.augmented_descartes_general"
      module: "Solution"
      status: "proved"
      note: "The augmented Euclidean Descartes theorem (LMW Theorem 3.3) for spheres and hyperplanes."
    - source: "LMW Theorem 3.3, the converse, in the distance-encoded sense (spheres and hyperplanes)"
      lean: "AugmentedDescartes.augmented_descartes_converse"
      module: "Solution"
      status: "proved"
      note: "The converse of LMW Theorem 3.3 (spheres and hyperplanes): every real solution is the augmented matrix of exactly one family of valid, pairwise tangent oriented spheres and hyperplanes (tangency in the signed-distance sense; disjoint interiors not asserted)."
    - source: "LMW Theorem 3.3, the converse, for a solution whose second column has no zero"
      lean: "AugmentedDescartes.augmented_descartes_converse_spheres"
      module: "Solution"
      status: "proved"
      note: "The converse for spheres: a solution whose second column has no zero is the augmented matrix of exactly one pairwise tangent family of spheres, `rᵢ = 1 / W i (Sum.inl 1)` and `xᵢ k = W i (Sum.inr k) / W i (Sum.inl 1)` (tangency in the signed-distance sense)."
    - source: "LMW Theorem 1.2, equation (1.2); Theorem 3.1 is its converse (Soddy 1936, Gosset 1937; Lachlan 1886 at n = 3)"
      lean: "AugmentedDescartes.soddy_gosset"
      module: "Solution"
      status: "proved"
      note: "The Soddy–Gosset theorem (LMW Theorem 1.2, (1.2); Soddy 1936, Gosset 1937, Lachlan 1886 at `n = 3`): `(Σ 1/rᵢ)² = n Σ (1/rᵢ)²`."
    - source: "LMW Theorem 1.2 with hyperplanes (curvature 0)"
      lean: "AugmentedDescartes.soddy_gosset_general"
      module: "Solution"
      status: "proved"
      note: "The Soddy–Gosset theorem for spheres and hyperplanes (curvature `0` for a hyperplane)."
    - source: "LMW (3.2): the Soddy-Gosset relation as the vanishing of the Descartes form"
      lean: "AugmentedDescartes.soddy_gosset_iff_isotropic"
      module: "Solution"
      status: "proved"
      note: "The Soddy–Gosset relation is the vanishing of the Descartes form: `(Σ bᵢ)² = n Σ bᵢ² ↔ bᵀ Qₙ b = 0`."
    - source: "LMW Theorem 3.2, equation (3.5), spheres"
      lean: "AugmentedDescartes.curvature_center"
      module: "Solution"
      status: "proved"
      note: "The Euclidean generalized Descartes theorem (LMW Theorem 3.2, (3.5)) for spheres: `Mᵀ Qₙ M = diag(0, 2 Iₙ)`."
    - source: "LMW Theorem 3.2, equation (3.5), spheres and hyperplanes"
      lean: "AugmentedDescartes.curvature_center_general"
      module: "Solution"
      status: "proved"
      note: "LMW Theorem 3.2 for spheres and hyperplanes."
    - source: "LMW Theorem 2.1, equation (2.2), circles of nonzero curvature"
      lean: "AugmentedDescartes.complex_descartes"
      module: "Solution"
      status: "proved"
      note: "The complex Descartes theorem (LMW Theorem 2.1, (2.2)) for four circles of nonzero curvature: with `zᵢ = xᵢ + i yᵢ`, `(Σ bᵢ zᵢ)² = 2 Σ (bᵢ zᵢ)²`."
    - source: "LMW equation (2.3)"
      lean: "AugmentedDescartes.complex_descartes_mixed"
      module: "Solution"
      status: "proved"
      note: "LMW (2.3): `Σ bᵢ (bᵢ zᵢ) = ½ (Σ bᵢ)(Σ bᵢ zᵢ)`."
    - source: "GLMWY III, equation (6.4) in the proof of Lemma 6.4"
      lean: "AugmentedDescartes.det_descartesQ"
      module: "Solution"
      status: "proved"
      note: "`det Qₙ = −2/n` (GLMWY III, (6.4) in the proof of Lemma 6.4)."
    - source: "LMW Theorem 1.2 for Mathlib's EuclideanGeometry.Sphere, case (i) of LMW p. 7"
      lean: "AugmentedDescartes.sphere_soddy_gosset"
      module: "Solution"
      status: "proved"
      note: "Soddy–Gosset for Mathlib's spheres: `n + 2` spheres of positive radius, pairwise externally tangent (LMW's case (i); at `n = 1` the hypotheses cannot be met, three pairwise externally tangent intervals forcing a zero radius)."
    - source: "LMW Theorem 1.2 for Mathlib's EuclideanGeometry.Sphere, case (ii) of LMW p. 7"
      lean: "AugmentedDescartes.sphere_soddy_gosset_enclosing"
      module: "Solution"
      status: "proved"
      note: "Soddy–Gosset with one enclosing sphere `e`, to which the others are internally tangent (`IsIntTangent (s j) (s e)`: `s j` lies inside `s e`) and which carries the curvature `−1/rₑ` (LMW's case (ii))."
    - source: "LMW Theorem 3.3 for Mathlib's EuclideanGeometry.Sphere"
      lean: "AugmentedDescartes.sphere_augmented_descartes"
      module: "Solution"
      status: "proved"
      note: "The augmented identity for Mathlib's spheres, pairwise externally tangent (unsatisfiable at `n = 1`)."
    - source: "GLMWY III, proof of Theorem 6.1 (the configuration with curvatures (0, 0, 1, ..., 1))"
      lean: "AugmentedDescartes.exists_configuration"
      module: "Solution"
      status: "proved"
      note: "Existence of a configuration in every dimension: two parallel hyperplanes at distance `2` and `n` unit spheres centred at `√2 eᵢ` (the configuration of GLMWY III, Theorem 6.1, stated there for `n ≥ 2`; at `n = 1` the hyperplanes are oriented points)."
    - source: "This development (two Apollonian reflections of GLMWY III's configuration; the line at n = 1)"
      lean: "AugmentedDescartes.exists_pairwiseTangent"
      module: "Solution"
      status: "proved"
      note: "Existence of a pairwise tangent family of spheres in every dimension."
    - source: "LMW Theorem 3.1, the existence half of the converse of Soddy-Gosset (LMW: 'We do not know an easy proof of this result; a proof appears in [16]'; GLMWY III arXiv v1-v2, Theorem 2.2 (i), by the same route)"
      lean: "AugmentedDescartes.converse_soddy_gosset"
      module: "Solution"
      status: "proved"
      note: "The existence half of the converse of the Soddy–Gosset theorem (LMW Theorem 3.1, which LMW state with \"We do not know an easy proof of this result; a proof appears in [16]\"; GLMWY III's arXiv versions 1–2 prove it as their Theorem 2.2 by the same route): every nonzero `b` with `(Σ bᵢ)² = n Σ bᵢ²` is the curvature vector of a pairwise tangent family of valid oriented spheres (`bᵢ ≠ 0`) and hyperplanes (`bᵢ = 0`), tangency in the signed-distance sense; the congruence half is not formalized."
    - source: "LMW Theorem 3.1, the existence half of the converse, for a curvature vector with no zero entry (GLMWY III arXiv v1-v2, Theorem 2.2 (i))"
      lean: "AugmentedDescartes.converse_soddy_gosset_spheres"
      module: "Solution"
