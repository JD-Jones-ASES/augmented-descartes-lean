automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Fable 5.1 (Anthropic)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        The project was directed by its author. Claude (Anthropic) in Claude Code was used throughout: the
        reading of the three papers as printed pages, the statements and their check against them, the exact
        replay of the identities in the standard library, the Lean proofs, the prior-art searches and the
        repository text; Claude Fable 5.1 pinned the statements, wrote the replay checker, merged the proof
        modules and wrote the documents, and Claude Opus 5.5 subagents wrote and adapted the Lean proofs,
        checked the statements against the printed pages and audited the proofs in separate passes. Lean
        v4.35.0-rc2 and Mathlib v4.35.0-rc2 (commit 065356127b1dc0016f66b7283ce0ce2c4055aa55) are pinned by the
        committed manifest and lake update is never run; there are no GitHub Actions workflows. There is no
        native_decide and no decide +kernel: the proofs are matrix algebra over the reals (entrywise
        computations, the explicit inverses, Matrix.mul_eq_one_comm_of_equiv for the swap of factors) and
        coordinate identities on EuclideanSpace R (Fin n) closed by field_simp, ring and linear_combination.
    - method: "agent"
      models: ["GPT (OpenAI)"]
      framework: "ChatGPT"
      tool_setup: >-
        A pre-submission consult on the tree at c9277f7 (2026-10-10). Its proposals, the congruence and
        orientation modules with their replay checks and the replay's Fraction constants, were checked here with
        the full verification gate and adapted before adoption; the documentation is this repository's.
  spend_usd: "not tracked"

fidelity:
  divergences: >-
    Rows are indexed by Fin 2 + Fin n (the two hyperbolic coordinates b-bar, b and the n centre coordinates), so
    the augmented matrix has type Matrix (Fin (n + 2)) (Fin 2 + Fin n) R and the target is a fromBlocks
    matrix; LMW write (n + 2) x (n + 2) matrices. An oriented sphere or hyperplane is a value of the sum type
    (EuclideanSpace R (Fin n) x R) + (EuclideanSpace R (Fin n) x R), the left summand a centre with a signed
    radius, the right a unit normal with an offset, with validity (radius nonzero; normal of norm 1) a
    separate predicate; the curvature of a hyperplane is 0. Tangency is the distance encoding of LMW's oriented
    tangency (two spheres dist^2 = (r + s)^2; a sphere and a hyperplane <h, x> - delta = -r; two hyperplanes
    opposite normals), the pairwise form of LMW's oriented tangency (GLMWY III arXiv v2, Lemma 2.5 (ii)), and the converses deliver
    tangency in this sense. LMW's compatibility of orientations for a whole configuration is proved separately,
    for the rows of any solution: with B the total curvature, nonzero, the sets {y : B F_i(y) < 0} are pairwise
    disjoint, F_i the power polynomial of row i, whose negative set is the open ball, the open exterior (negative
    radius) or the open half-space the normal points to; for B < 0 these are the interiors of the reversed rows,
    and for a valid, pairwise tangent family with B > 0 the open interiors themselves are pairwise disjoint.
    LMW's distinct tangencies appear as: no three boundaries share a finite point, at most two rows are
    hyperplanes; there is no compactification, and tangency at infinity is the convention of opposite normals.
    The dimension is every n >= 1 (hypothesis 0 < n, needed for Q_n), where LMW's Section 3 assumes
    n >= 2 and their Section 8 states the identity on the line, (8.4), with the same target under its own
    convention for the infinite interval; the hyperplanes of n = 1 here are oriented points, tangent when
    their normals are opposite, which that section does not treat; the Apollonian statements assume n >= 2,
    apollonianGen_mul_apply being false at n = 1 where Lean's 2/0 = 0 makes S_k the identity. The
    converse of Theorem 3.2 carries the hypothesis that the first column of M is nonzero, which LMW's printed
    statement omits, which GLMWY I's Theorem 3.1 carries at n = 2, and which
    curvature_center_converse_needs_nonzero shows is needed. Both halves of Theorem 3.1 are formalized, the congruence half for families labelled alike, with the motion
    x -> x O + t in row-vector convention, O orthogonal (reflections included) and unique, and congruence
    equivalent to equal curvature vectors since a motion preserves validity, curvature and tangency. The Mathlib
    statements use
    EuclideanGeometry.Sphere.IsExtTangent and IsIntTangent with positive radii, the enclosing sphere's curvature
    written -1/r_e; sphere_soddy_gosset and sphere_augmented_descartes have no instance at n = 1 (three
    pairwise externally tangent intervals force a zero radius). Gosset is spelled as the mathematician spelled
    it (LMW print "Gossett" in Theorem 1.2 and "Gosset" in Theorem 3.1).

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is claimed; AI agents wrote the proofs
    and audited them in separate passes, the statements were checked against the printed pages of the three
    papers, the identities are replayed by scripts/check_descartes.py in the standard library, and VERIFICATION.md
    states what is checked and what is not. Mechanical correctness and agreement of formal statements do not
    establish significance: the augmented theorem, its converse, the Soddy-Gosset and curvature-centre theorems
    and the complex Descartes theorem are LMW's, the compatible orientations are part of their converse of
    Theorem 3.3 (a solution is an oriented Descartes configuration), and the proof route of the identity is their
    Section 4 argument in Euclidean coordinates; the converses of Theorems 3.1 and 3.2 are stated by LMW, who
    refer to Graham-Lagarias-Mallows-Wilks-Yan III for proofs (whose arXiv versions 1-2 prove both halves of the
    former as Theorem 2.2), and the n = 2 converse of Theorem 3.2 with its hypothesis is GLMWY I's Theorem 3.1;
    the Apollonian generators, the existence of a configuration, det Q_n and the action of Euclidean motions on
    augmented coordinates are in GLMWY III, and the two-spheres count in LMW's footnote 3. No earlier kernel
    check of any of these statements beyond ATLAS's planar relation was found by the dated searches (Palomar's
    feed and day index, ATLAS, Mathlib and its 1000.yaml, formal-conjectures, openai/math, LeanPool,
    anthropics/formal-math, the Isabelle AFP, GitHub code search in Lean, Isabelle and Coq and the arXiv listing
    on 2026-10-09, 2026-10-10 and 2026-10-11 UTC; Rocq's opam index and HOL Light on 2026-10-09 and
    2026-10-10); rjwalters/lean-genius and carlok/LeanFrontier hold the planar relation as a definition with its
    roots, reflections and parity, and one Ford-circle instance, with no derivation from tangency.

